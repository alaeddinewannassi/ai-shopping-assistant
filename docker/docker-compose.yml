services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-prestashop_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-prestashop}
      MYSQL_USER: ${MYSQL_USER:-prestashop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-prestashop}
    volumes:
      - prestashop_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-prestashop_root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  prestashop:
    build:
      context: ..
      dockerfile: docker/prestashop/Dockerfile
      args:
        # Fixed, not random — the provisioning step (docker/prestashop/README.md) issues
        # this SAME string as the tenant's widget key in the tenancy DB, so the widget
        # baked into this store's footer resolves to the right tenant from its first load.
        WIDGET_TENANT_KEY: ${WIDGET_TENANT_KEY_ONE:-demo-widget-key-store-one}
        WIDGET_API_BASE: ${WIDGET_API_BASE:-http://localhost:8000}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_SERVER: mysql
      DB_NAME: ${MYSQL_DATABASE:-prestashop}
      DB_USER: ${MYSQL_USER:-prestashop}
      DB_PASSWD: ${MYSQL_PASSWORD:-prestashop}
      PS_DOMAIN: ${PS_DOMAIN:-localhost:8080}
      PS_FOLDER_ADMIN: ${PS_FOLDER_ADMIN:-admin}
      PS_FOLDER_INSTALL: ${PS_FOLDER_INSTALL:-install}
      PS_INSTALL_AUTO: ${PS_INSTALL_AUTO:-1}
      PS_ENABLE_SSL: 0
      ADMIN_MAIL: ${PS_ADMIN_EMAIL:-demo@example.com}
      ADMIN_PASSWD: ${PS_ADMIN_PASSWORD:-AssistantDemo123!}
    ports:
      - "8080:80"
    volumes:
      - prestashop_data:/var/www/html
      - ./prestashop:/tmp/fixtures:ro

  # Second reference store — a fully independent PrestaShop + MySQL pair, used to prove
  # real multi-tenancy manually: two live "shopping websites" whose adapter config lives in
  # two different Tenant rows, served by the SAME chatbot/backend and administered from the
  # SAME backoffice login (chatbot/backend/src/tenancy/resolver.py resolves per-request from
  # the X-Assistant-Key header — there is nothing store-specific baked into the process).
  mysql-two:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_TWO_ROOT_PASSWORD:-prestashop_root_two}
      MYSQL_DATABASE: ${MYSQL_TWO_DATABASE:-prestashop_two}
      MYSQL_USER: ${MYSQL_TWO_USER:-prestashop_two}
      MYSQL_PASSWORD: ${MYSQL_TWO_PASSWORD:-prestashop_two}
    volumes:
      - prestashop_db_two:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_TWO_ROOT_PASSWORD:-prestashop_root_two}"]
      interval: 10s
      timeout: 5s
      retries: 10

  prestashop-two:
    build:
      context: ..
      dockerfile: docker/prestashop/Dockerfile
      args:
        WIDGET_TENANT_KEY: ${WIDGET_TENANT_KEY_TWO:-demo-widget-key-store-two}
        WIDGET_API_BASE: ${WIDGET_API_BASE:-http://localhost:8000}
    depends_on:
      mysql-two:
        condition: service_healthy
    environment:
      DB_SERVER: mysql-two
      DB_NAME: ${MYSQL_TWO_DATABASE:-prestashop_two}
      DB_USER: ${MYSQL_TWO_USER:-prestashop_two}
      DB_PASSWD: ${MYSQL_TWO_PASSWORD:-prestashop_two}
      PS_DOMAIN: ${PS_DOMAIN_TWO:-localhost:8090}
      PS_FOLDER_ADMIN: ${PS_FOLDER_ADMIN:-admin}
      PS_FOLDER_INSTALL: ${PS_FOLDER_INSTALL:-install}
      PS_INSTALL_AUTO: ${PS_INSTALL_AUTO:-1}
      PS_ENABLE_SSL: 0
      ADMIN_MAIL: ${PS_ADMIN_EMAIL_TWO:-demo-two@example.com}
      ADMIN_PASSWD: ${PS_ADMIN_PASSWORD_TWO:-AssistantDemo123!}
    ports:
      - "8090:80"
    volumes:
      - prestashop_data_two:/var/www/html
      - ./prestashop:/tmp/fixtures:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Tenancy/admin/analytics database (specs/002-backoffice-analytics) — deliberately
  # separate from `mysql` above, which is PrestaShop's own database (Constitution
  # Principle II: platform integration data must not couple to assistant-owned storage).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assistant}
    ports:
      - "5432:5432"
    volumes:
      - assistant_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assistant}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: applies tenancy-db's Alembic migrations, then exits. Neither app service runs
  # its own migrations on boot (see tenancy-db/Dockerfile) — both wait on this one instead,
  # so `docker compose up` always leaves the schema in a valid state before either starts.
  migrate:
    build:
      context: ..
      dockerfile: tenancy-db/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-assistant}:${POSTGRES_PASSWORD:-assistant}@postgres:5432/${POSTGRES_DB:-assistant}
    restart: "no"

  assistant-service:
    build:
      context: ..
      dockerfile: chatbot/backend/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      prestashop:
        condition: service_started
      prestashop-two:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      # Vestigial for the two-tenant manual test below: once both tenants exist as DB rows
      # with their own TenantAdapterConfig, resolver.py resolves each request's adapter
      # config from the X-Assistant-Key header, never from these process-level env vars.
      # They only matter for a request with NO assistant key, falling back to
      # DEFAULT_TENANT_SLUG's legacy single-tenant config (plan.md D2).
      PRESTASHOP_BASE_URL: http://prestashop/api
      # PrestaShop redirects any request whose Host header doesn't match its configured
      # PS_DOMAIN — override it here since we reach the store via the internal Docker
      # hostname "prestashop" rather than the browser-facing PS_DOMAIN below.
      PRESTASHOP_HOST_HEADER: ${PS_DOMAIN:-localhost:8080}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-assistant}:${POSTGRES_PASSWORD:-assistant}@postgres:5432/${POSTGRES_DB:-assistant}
    env_file:
      - path: ../chatbot/backend/.env
        required: false
    ports:
      - "8000:8000"

  # Admin/analytics API — a separate service from assistant-service above (no shared
  # process, D6). Depends only on postgres, never on prestashop/redis/mysql.
  backoffice-service:
    build:
      context: ..
      dockerfile: backoffice/backend/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-assistant}:${POSTGRES_PASSWORD:-assistant}@postgres:5432/${POSTGRES_DB:-assistant}
      ADMIN_CORS_ORIGINS: ${ADMIN_CORS_ORIGINS:-http://localhost:5173}
      # This whole compose file is the local/demo stack (see docker/prestashop/README.md) —
      # COOKIE_SECURE defaults to false here only because that stack is plain HTTP. A real
      # deployment behind TLS must set COOKIE_SECURE=true (or just leave it unset — the
      # backend's own default is already "true", see backoffice/backend/.env.example).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    env_file:
      - path: ../backoffice/backend/.env
        required: false
    ports:
      - "8001:8001"

  backoffice-frontend:
    build:
      context: ../backoffice/frontend
      args:
        VITE_API_BASE: ${BACKOFFICE_API_BASE:-http://localhost:8001}
    depends_on:
      - backoffice-service
    ports:
      - "5173:8080"

volumes:
  prestashop_db:
  prestashop_data:
  prestashop_db_two:
  prestashop_data_two:
  redis_data:
  assistant_db:
