[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "backoffice-backend"
version = "0.1.0"
description = "Multi-tenant admin/analytics API for the AI Shopping Assistant backoffice (specs/002-backoffice-analytics). A separate deployable service from chatbot/backend/ (the shopper-facing chatbot) — the two share no process, and the only thing they have in common is the tenancy-db package (read-only for the chatbot, read-write here). Serves the backoffice/frontend/ SPA."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic[email]>=2.9",
    "uvicorn[standard]>=0.30",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    # Shared tenancy/admin data layer (../../tenancy-db) — this service owns writes to it
    # (tenant/adapter/LLM/promo config, widget keys, admin users). Install with:
    #   pip install -e ../../tenancy-db
    "tenancy-db",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008 (function call in a default argument) is a false positive for FastAPI's
# `Depends(...)`/`Cookie(...)` dependency-injection pattern, used throughout src/auth/ and
# src/api/routes/ — that's the framework's documented, required usage, not a bug (matches
# the same ignore in chatbot/backend/pyproject.toml).
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
